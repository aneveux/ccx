name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git-changelist-maven-extension needs the full commit count
      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          # Pinned exactly, and identically in ci.yml — see the comment there.
          java-version: '25.0.2'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
      # `verify` runs CcxNativeIT against the freshly built binary, so a release never ships a native
      # image that fails on its first real invocation.
      - name: Build native image and run it
        run: mvn -Pnative verify -B -Dchangelist=
      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccx-native-linux-x86_64
          path: target/ccx

  release:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ccx-native-linux-x86_64
          path: target/
      - name: Make binary executable
        run: chmod +x target/ccx
      - name: JReleaser full release
        run: mvn -Prelease jreleaser:full-release -B -Dchangelist=
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
