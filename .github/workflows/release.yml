name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-changelist-maven-extension needs the full commit count
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
      - name: Build native image
        run: mvn -Pnative package -DskipTests -B -Dchangelist=
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccx-native-linux-x86_64
          path: target/ccx

  release:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: ccx-native-linux-x86_64
          path: target/
      - name: Make binary executable
        run: chmod +x target/ccx
      - name: JReleaser full release
        run: mvn -Prelease jreleaser:full-release -B -Dchangelist=
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
