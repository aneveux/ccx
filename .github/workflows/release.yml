name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git-changelist-maven-extension needs the full commit count
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          # Pinned exactly, and identically in ci.yml — see the comment there.
          java-version: '25.0.2'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
      # `verify` runs CcxNativeIT against the freshly built binary, so a release never ships a native
      # image that fails on its first real invocation.
      - name: Build native image and run it
        run: mvn -Pnative verify -B -Dchangelist=
      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccx-native-linux-x86_64
          path: target/ccx

  release:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download native artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccx-native-linux-x86_64
          path: target/
      - name: Make binary executable
        run: chmod +x target/ccx
      - name: JReleaser full release
        run: mvn -Prelease jreleaser:full-release -B -Dchangelist=
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
