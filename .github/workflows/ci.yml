name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git-changelist-maven-extension needs the full commit count

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run tests (incremental version)
        run: mvn verify -B -Dset.changelist -Dignore.dirt

  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            native:
              - 'src/main/java/me/neveux/ccx/graal/**'
              # Jackson records are reflection-only: a new or renamed one breaks the native
              # binary at runtime and nothing on the JVM side notices.
              - 'src/main/java/me/neveux/ccx/model/**'
              - 'src/main/resources/META-INF/**'
              - 'src/main/resources/application.properties'
              - 'pom.xml'

  native-smoke:
    runs-on: ubuntu-latest
    needs: changes
    if: >
      !cancelled() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.native == 'true')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git-changelist-maven-extension needs the full commit count
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          # Pinned exactly, and identically in release.yml: an unpinned '25' silently follows the
          # latest patch, so a native-image regression would land in CI (and in a release) on a day
          # nothing in this repo changed.
          java-version: '25.0.2'
          distribution: 'graalvm-community'
      # `verify`, not `package`: the native profile binds failsafe with native.image.path, so this is
      # what actually executes the binary (CcxNativeIT) and catches a missing reflection entry.
      - name: Build native image and run it (smoke test)
        run: mvn -Pnative verify -B -Dset.changelist -Dignore.dirt
      - name: Upload native smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccx-native-smoke-linux
          path: target/ccx
