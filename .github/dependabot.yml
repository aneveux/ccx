version: 2

updates:
  # Quarkus platform, tamboui, picocli and the build plugins. Grouped into one PR per week so a
  # platform bump and the transitive versions it drags along are reviewed (and CI-verified) together.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns:
          - '*'
    ignore:
      # jline 4.x ships an FFM terminal provider native-image cannot compile:
      # `org.jline.terminal.impl.ffm.CLibrary.isTty` uses the `linkToNative` polymorphic
      # signature and the points-to analysis dies on it (reproduced on 4.2.1 and 4.3.1,
      # PR #2). The pom pins 3.25.1 for that reason — see the comment there. Drop this
      # entry once tamboui ships a jline 4 backend.
      - dependency-name: org.jline:jline
        versions: ['>=4']

  # Actions are SHA-pinned, so dependabot is the only thing that will ever move them: it rewrites
  # both the SHA and the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
